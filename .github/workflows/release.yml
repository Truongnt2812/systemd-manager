name: Release

on:
  push:
    tags: ["[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: write

jobs:
  check-version:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Tag matches Cargo.toml version
        run: |
          crate_version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          if [ "$GITHUB_REF_NAME" != "$crate_version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match Cargo.toml version $crate_version"
            exit 1
          fi

  deb:
    needs: check-version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libadwaita-1-dev libgtksourceview-5-dev

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-deb
        run: cargo install cargo-deb --locked

      - name: Build the .deb
        run: cargo deb --locked

      - uses: actions/upload-artifact@v4
        with:
          name: deb
          path: target/debian/*.deb

  rpm:
    needs: check-version
    runs-on: ubuntu-24.04
    container: fedora:latest
    steps:
      - name: Install build dependencies
        run: dnf install -y gcc git pkgconf-pkg-config gtk4-devel libadwaita-devel gtksourceview5-devel rpm-build

      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-generate-rpm
        run: cargo install cargo-generate-rpm --locked

      - name: Build the .rpm
        run: |
          cargo build --release --locked
          strip target/release/systemd-manager
          cargo generate-rpm

      - uses: actions/upload-artifact@v4
        with:
          name: rpm
          path: target/generate-rpm/*.rpm

  release:
    needs: [deb, rpm]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: packages
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: packages/*
          generate_release_notes: true
