name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build_verification:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libadwaita-1-dev libgtksourceview-5-dev appstream

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Tests
        run: cargo test --locked

      - name: Validate AppStream metainfo
        run: appstreamcli validate --no-net data/*.metainfo.xml

      - name: Check shell scripts
        run: |
          for f in install.sh uninstall.sh debian/postinst debian/postrm; do
            bash -n "$f"
          done
