[package]
name = "systemd-manager"
version = "0.2.0"
edition = "2021"
description = "A GTK4/libadwaita desktop app for managing systemd services"
license = "MIT"

[dependencies]
gtk = { package = "gtk4", version = "0.11", features = ["v4_14"] }
adw = { package = "libadwaita", version = "0.9", features = ["v1_5"] }
zbus = { version = "5", default-features = false, features = ["blocking-api", "async-io"] }
async-channel = "2"
sourceview5 = "0.11"
serde = "1"

[package.metadata.deb]
maintainer = "Truong Nguyen <truongntwork@gmail.com>"
section = "admin"
depends = "$auto, policykit-1 | polkitd"
extended-description = "GTK4 app for managing systemd services."
maintainer-scripts = "debian/"
assets = [
  ["target/release/systemd-manager", "usr/bin/", "755"],
  ["data/io.github.systemd_manager.SystemdManager.desktop", "usr/share/applications/", "644"],
  ["data/io.github.systemd_manager.SystemdManager.metainfo.xml", "usr/share/metainfo/", "644"],
  ["data/io.github.systemd_manager.SystemdManager.svg", "usr/share/icons/hicolor/scalable/apps/", "644"],
  ["data/icons/48x48.png", "usr/share/icons/hicolor/48x48/apps/io.github.systemd_manager.SystemdManager.png", "644"],
  ["data/icons/256x256.png", "usr/share/icons/hicolor/256x256/apps/io.github.systemd_manager.SystemdManager.png", "644"],
  ["README.md", "usr/share/doc/systemd-manager/", "644"],
]

# For `cargo generate-rpm` (see .github/workflows/release.yml). Build first with
# `cargo build --release`.
[package.metadata.generate-rpm]
summary = "GTK4 app for managing systemd services"
assets = [
  { source = "target/release/systemd-manager", dest = "/usr/bin/systemd-manager", mode = "755" },
  { source = "data/io.github.systemd_manager.SystemdManager.desktop", dest = "/usr/share/applications/io.github.systemd_manager.SystemdManager.desktop", mode = "644" },
  { source = "data/io.github.systemd_manager.SystemdManager.metainfo.xml", dest = "/usr/share/metainfo/io.github.systemd_manager.SystemdManager.metainfo.xml", mode = "644" },
  { source = "data/io.github.systemd_manager.SystemdManager.svg", dest = "/usr/share/icons/hicolor/scalable/apps/io.github.systemd_manager.SystemdManager.svg", mode = "644" },
  { source = "data/icons/48x48.png", dest = "/usr/share/icons/hicolor/48x48/apps/io.github.systemd_manager.SystemdManager.png", mode = "644" },
  { source = "data/icons/256x256.png", dest = "/usr/share/icons/hicolor/256x256/apps/io.github.systemd_manager.SystemdManager.png", mode = "644" },
  { source = "README.md", dest = "/usr/share/doc/systemd-manager/README.md", mode = "644", doc = true },
]

[package.metadata.generate-rpm.requires]
polkit = "*"
